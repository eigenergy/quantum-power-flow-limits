name: PowerIO prerelease

on:
  push:
    branches:
      - agent/powerio-v09-migration
  workflow_dispatch:
    inputs:
      powerio-ref:
        description: PowerIO git ref to build and test against
        required: false
        default: v09/review-pass-2

permissions:
  contents: read

jobs:
  prerelease-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.14"

      - name: Build PowerIO from the release stack
        env:
          POWERIO_REF: ${{ inputs.powerio-ref || 'v09/review-pass-2' }}
        run: |
          set -euo pipefail
          python -m pip install \
            "powerio @ git+https://github.com/eigenergy/powerio@${POWERIO_REF}" \
            pytest==9.0.2 networkx==3.5

      - name: Run the PowerIO surface tests
        run: python -m pytest -q experiments/tests/test_powerio_compat.py
