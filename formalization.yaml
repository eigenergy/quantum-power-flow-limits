fidelity:
  divergences: >-
    Proposition 3 recovers the full readout product
    for the clean opaque controlled QLS unitary and inverse family assumed by the
    cited tomography theorem. Explicit inverse preparation rotations are O(1/kappa) apart
    while their normalized solution states have constant separation, forcing the
    fixed coherent schedule to use Omega(kappa) queries. Tomography then selects one
    balanced hard input that invokes the same schedule tilde Omega(n/epsilon)
    times. Target reachability on the invertible balanced space and the resulting
    product are proved in Lean; the tomography and standard hybrid lower bounds are
    explicit literature premises. The joint hard family theorem gives an independent
    n*kappa/epsilon route. Its unit star witness has an
    exact balanced slow eigenspace and radial fast mode checked in Lean. The
    fractional phase direct sum lower bound is represented as a cited hypothesis.
    Local observables are restricted to the paper's nonzero-gap bus and branch rank-one class,
    and their query lower bound is composed with the fixed solve schedule. The pass-through
    instance remains a counterexample to stronger instancewise readings. Planar separator existence,
    planarization, and weighted balance behind the near planar extension remain
    literature dependencies. Corollary 1(i)'s tree decomposition
    separator is constructed in Lean. Ordinary path
    connectivity now implies spectral positivity for positive weights. The
    grounded trace correction, Poincare separation, and corrected grounded
    condition-number transfer are proved. Proposition 2's Corollary 1 transfer is proved
    conditional on the same explicit separator partitions.
    Proposition 2 makes pointwise boundedness and positivity assumptions
    explicit; connectivity is fixed by the topology. The repository also proves a sharper
    interface stiffness separator bound and a weighted degree hub bound.

review:
  status: "self-assessed"
  reviewers:
    - "Cameron Khanpour"
    - "Samuel Talkington"
  notes: >-
    The proof modules build without sorry and report only Lean's standard
    axioms. The manifest, statement surface, and permitted axiom checks run in
    clean CI. The Ubuntu job runs Comparator with both kernels under landrun and
    systemd isolation; the macOS wrapper is only a development smoke test.

