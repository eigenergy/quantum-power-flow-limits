fidelity:
  divergences: >-
    The Lean statements follow the first revision of the letter. Proposition 2
    obtains the full readout product for the clean opaque controlled QLS unitary and
    inverse family assumed by the cited tomography theorem. Explicit inverse
    preparation rotations are O(1/kappa) apart while their normalized solution
    states have constant separation, forcing the fixed coherent schedule to use
    Omega(kappa) queries. Tomography then selects one balanced hard input that
    invokes the same schedule tilde Omega(n/epsilon) times. Target reachability on
    the invertible balanced space and the resulting product are proved in Lean; the
    tomography and standard hybrid lower bounds are explicit literature premises.
    Success probabilities enter only through those premises. Local observables are
    restricted to the letter's bus and branch class with a nonzero gap. The
    pass-through instance remains a counterexample to stronger instancewise
    readings. Planarity is an abstract predicate, and the vertex cost form of the
    Lipton--Tarjan theorem is a theorem valued premise; the planarization, the
    projected separator of size 2 sqrt(8(n+c)), and the resulting bounds are proved.
    The near planar bound is stated above the explicit threshold
    1152 (n + c) <= n^2 instead of asymptotically. Condition numbers of the DC-OPF
    Newton matrix and of the block diagonal AC Jacobian are stated through singular
    value bounds, which is the statement about kappa_2 for an invertible matrix.
    Proposition 3 is proved for an arbitrary generation block and generator map, a
    hypothesis weaker than the letter's positive diagonal block. The effective
    condition number of input dependent solvers is defined from the letter's
    description (the largest spectral cutoff below which the solution carries
    squared mass at most epsilon^2); its agreement with the definition in the cited
    work is not checked in Lean. The energy norm conversion assumes that the error
    of the classical output is balanced. The repository also proves a sharper
    interface stiffness separator bound and a weighted degree hub bound.

review:
  status: "self-assessed"
  reviewers:
    - "Cameron Khanpour"
    - "Samuel Talkington"
  notes: >-
    The proof modules build without sorry and report only Lean's standard
    axioms. The manifest, statement surface, and permitted axiom checks run in
    clean CI. The Ubuntu job runs Comparator with both kernels under landrun and
    systemd isolation; the macOS wrapper is only a development smoke test.

