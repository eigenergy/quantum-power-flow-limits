# formalization.yaml (v0.3): repo-root metadata for formalization projects.
version: "v0.3"

project:
  name: "quantum-power-flow-limits"
  authors:
    - "Cameron Khanpour"
    - "Samuel Talkington"
  license: "MIT"

sources:
  - title: "Proving the Limits of Quantum Power Flow"
    authors:
      - "Cameron Khanpour"
      - "Samuel Talkington"
    id: "arXiv:2607.19263"
    type: "preprint"
    author_contacted: "n/a"

status:
  scope: >-
    Lean 4 verification of the first revision of the letter. Lemma 1, Theorem 1
    with both terms of its maximum, Corollary 1(i) including the quarter balanced
    separation, Proposition 1 in its maximum form, and Proposition 3 on the DC-OPF
    Newton system are proved from explicit hypotheses. Corollary 1(ii) and the near
    planar extension are proved relative to the vertex cost form of the cited
    Lipton--Tarjan theorem, including the planarization of a drawing with crossings
    and the projection of the separator to the original buses. The setup claims are
    proved: the pseudo condition number is the condition number on balanced
    injections, every bound transfers to the grounded matrix with its constant
    halved, and energy norm accuracy converts to Euclidean accuracy (fact F3).
    Proposition 2 is proved relative to the cited hybrid and tomography results:
    the balanced hard pair, the canonical preparation oracles, the decision rule for
    outputs of accuracy below one over root two, balanced target reachability, the
    fixed schedule readout product, the local observable result, and the equality
    of the effective and pseudo condition numbers on the hard pair. For the first
    AC Newton system the off diagonal Jacobian blocks are shown to vanish at flat
    angles and the block diagonal system is shown to be at least as ill-conditioned
    as the grounded matrix. The probabilistic Proposition 2 of the submitted version
    remains proved in Random.lean but is no longer part of the letter or of the
    public claim surface.
  sorry_count: 0
  sorry_in_definitions: 0
  notes: >-
    Challenge.lean contains intentional statement placeholders for Comparator;
    they are not part of the proof implementation counted above. Condition numbers
    of matrices that are not Laplacians (the DC-OPF Newton matrix and the block
    diagonal AC Jacobian) are stated through singular value bounds: every pair of
    bounds sigma_min and sigma_max on the action of the matrix satisfies the stated
    lower bound on sigma_max / sigma_min. QueryHardness.lean proves the balanced
    hard pair, its canonical preparation oracle distance, the coded attenuation,
    exact star spectrum, and local observable algebra on the standard lossless
    domain span(1)^perp. EndToEnd.lean proves the worst case corridor comparison
    and the clean QLS readout product on one worst case balanced injection, plus
    the independent joint n*kappa/epsilon product. The retained numerical survey
    stores its query diagnostics under the key proposition3, which is the
    numbering of the submitted version.
