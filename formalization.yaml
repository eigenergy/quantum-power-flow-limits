automation:
  methods:
    - method: "other"
      tool_setup: >-
        Lake builds the Lean modules; repository scripts check the claim
        manifest and axiom closure; Comparator checks the independent statement
        surface.
  notes: "The pinned Ubuntu workflow runs both configured kernels."

fidelity:
  divergences: >-
    The planar and near planar wrappers take an explicit planarity predicate,
    a certificate for the relevant graph, and the theorem valued
    LiptonTarjanVertexCostTheorem premise. Lean proves the crossing schedule,
    planarized graph, branch routes, zero cost crossing weighting, separator
    projection, factor two size bound, original bus balance, and final condition
    bound. The public random wrappers expose both the pathwise topology bound
    and the exact finite Hoeffding exponent, and impose no mean to maximum
    ratio assumption.
    Proposition 3 recovers the readout product for a fixed coherent QLS schedule
    on the balanced zero sum space, relative to the cited hybrid and tomography
    lower bounds. The local observable result applies to the manuscript's bus
    and branch observables when the displayed gap is positive. Flat start AC
    and DC optimal power flow declarations cover only the modeled Laplacian
    blocks; broader Beyond DC statements remain discussion.

review:
  status: "self-assessed"
  reviewers:
    - "Cameron Khanpour"
    - "Samuel Talkington"
  notes: >-
    Proof modules contain no sorry. Comparator, the claim manifest checker,
    LeanChecker, and the axiom audit form the publication verification boundary.

