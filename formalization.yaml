# formalization.yaml (v0.3): repo-root metadata for formalization projects.
version: "v0.3"

project:
  name: "quantum-power-flow-limits"
  authors:
    - "Cameron Khanpour"
    - "Samuel Talkington"
  license: "MIT"

sources:
  - title: "The Limits of Quantum Computers for Power Flow"
    authors:
      - "Cameron Khanpour"
      - "Samuel Talkington"
    id: "arXiv:2607.19263"
    type: "preprint"
    author_contacted: "n/a"

status:
  scope: >-
    Lean 4 verification of the numbered claims in the manuscript: Lemma 1,
    Theorem 1, Corollary 1, and Propositions 1--3, together with the stated
    grid, corridor, planar, and near-planar specializations.
  sorry_count: 0
  sorry_in_definitions: 0
  notes: >-
    Challenge.lean contains intentional statement placeholders for Comparator;
    they are not part of the proof implementation counted above.
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "two_totalWeight_div_le_lambdaMax"
      file: "PowerFlowLimits/Eigenvalues.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "two_mul_weight_le_lambdaMax"
