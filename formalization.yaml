# formalization.yaml (v0.3): repo-root metadata for formalization projects.
version: "v0.3"

project:
  name: "quantum-power-flow-limits"
  authors:
    - "Cameron Khanpour"
    - "Samuel Talkington"
  license: "MIT"

sources:
  - title: "The Limits of Quantum Computers for Power Flow"
    authors:
      - "Cameron Khanpour"
      - "Samuel Talkington"
    id: "arXiv:2607.19263"
    type: "preprint"
    author_contacted: "n/a"

status:
  scope: >-
    Lean 4 verification of the structural arithmetic in Lemma 1, Theorem 1,
    Corollary 1, and Propositions 1--2, plus the Proposition 3 worst case balanced
    hard pair, canonical preparation oracles, balanced target reachability, fixed
    coherent schedule readout product, corridor comparison, joint product
    strengthening, QLS implementation accounting theorem, and local observable result. Ordinary graph connectivity is connected to spectral
    positivity. The grounded trace correction, variational Poincare separation,
    positive definiteness, and corrected condition-number transfer are proved;
    tree decomposition separator existence is proved locally; planar separator
    existence and a grounded Laplacian matrix only oracle reduction remain outside
    the proved scope.
  sorry_count: 0
  sorry_in_definitions: 0
  notes: >-
    Challenge.lean contains intentional statement placeholders for Comparator;
    they are not part of the proof implementation counted above. QueryHardness.lean proves the balanced hard pair,
    its canonical preparation oracle distance, the coded attenuation, exact star
    spectrum, and local observable algebra on the standard lossless domain
    span(1)^perp. EndToEnd.lean proves the worst case corridor comparison and the
    recovered clean QLS readout product on one worst case balanced injection, plus
    the independent joint n*kappa/epsilon product.
