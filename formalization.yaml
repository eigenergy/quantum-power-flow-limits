automation:
  methods:
    - method: "other"
      tool_setup: "The formalization process is not recorded in the repository metadata."
  notes: "Update this section if a more detailed process record becomes available."

fidelity:
  divergences: >-
    The separator-existence inputs behind Corollary 1 and the quantum query
    facts behind Proposition 3 are represented as explicit hypotheses, as in
    the manuscript's proofs. Proposition 2 makes pointwise boundedness,
    per-outcome connectivity, and positivity regularity assumptions explicit.
    The repository also proves a sharper interface-stiffness separator bound
    and a weighted-degree hub bound beyond the manuscript's numbered claims.

review:
  status: "self-assessed"
  reviewers:
    - "Cameron Khanpour"
    - "Samuel Talkington"
  notes: >-
    The proof modules build without sorry and report only Lean's standard
    axioms. Comparator independently checks the manuscript-facing declarations.

alignment:
  namespace: "root"
  statements:
    - source: "Lemma 1(i), trace form"
      lean: "two_totalWeight_div_le_lambdaMax"
      module: "PowerFlowLimits.Eigenvalues"
      status: "proved"
    - source: "Lemma 1(i), edge form"
      lean: "two_mul_weight_le_lambdaMax"
      module: "PowerFlowLimits.Eigenvalues"
      status: "proved"
    - source: "Lemma 1(ii), quotient form"
      lean: "lambda2_le_cut_div"
      module: "PowerFlowLimits.CutBounds"
      status: "proved"
    - source: "Lemma 1(ii), denominator-free form"
      lean: "lambda2_mul_le_cut"
      module: "PowerFlowLimits.CutBounds"
      status: "proved"
    - source: "Lemma 1, equation (2), total-weight form"
      lean: "kappaPlus_ge_totalWeight"
      module: "PowerFlowLimits.CutBounds"
      status: "proved"
    - source: "Lemma 1, equation (2), per-edge form"
      lean: "kappaPlus_ge_edge"
      module: "PowerFlowLimits.CutBounds"
      status: "proved"
    - source: "Theorem 1"
      lean: "separator_kappa_bound"
      module: "PowerFlowLimits.Separators"
      status: "proved"
    - source: "Corollary 1(i)"
      lean: "treewidth_kappa_bound"
      module: "PowerFlowLimits.Separators"
      status: "literature-dependency"
      note: "The separator partition is supplied as hypotheses."
    - source: "Corollary 1(ii)"
      lean: "planar_kappa_bound"
      module: "PowerFlowLimits.Separators"
      status: "literature-dependency"
      note: "The separator partition is supplied as hypotheses."
    - source: "Near-planar remark"
      lean: "near_planar_kappa_bound"
      module: "PowerFlowLimits.Separators"
      status: "literature-dependency"
      note: "The separator partition is supplied as hypotheses."
    - source: "Proposition 1"
      lean: "corridor_kappa_bound"
      module: "PowerFlowLimits.Corridors"
      status: "proved"
    - source: "Proposition 2"
      lean: "random_kappa_bound"
      module: "PowerFlowLimits.Random"
      status: "proved"
    - source: "Proposition 3(i), abstract form"
      lean: "e2e_query_lower_bound"
      module: "PowerFlowLimits.EndToEnd"
      status: "literature-dependency"
      note: "The quantum query inputs are supplied as hypotheses."
    - source: "Proposition 3(i), grid specialization"
      lean: "e2e_query_lower_bound_grid"
      module: "PowerFlowLimits.EndToEnd"
      status: "proved"
    - source: "Proposition 3(i), corridor specialization"
      lean: "e2e_query_lower_bound_corridor"
      module: "PowerFlowLimits.EndToEnd"
      status: "proved"
    - source: "Proposition 3(ii)"
      lean: "e2e_observable_lower_bound"
      module: "PowerFlowLimits.EndToEnd"
      status: "literature-dependency"
      note: "The quantum solve-cost input is supplied as a hypothesis."

acknowledgements: >-
  Built with Lean 4 and Mathlib; independent statement and axiom checking is
