status:
  scope: >-
    Lean 4 verification of Lemma 1, Theorem 1, Corollary 1,
    Propositions 1--3, the grounded correction, the flat start lossless AC
    active angle block, and the DC optimal power flow branch barrier angle
    Hessian stated in main_letter_v5.tex. The public Comparator surface has 18
    claims. The combinatorial planarization and separator projection are proved
    internally. Planarity of the constructed graph and the vertex cost
    Lipton--Tarjan theorem are explicit premises.
  sorry_count: 0
  sorry_in_definitions: 0
  notes: >-
    Challenge.lean contains 18 intentional statement placeholders for
    Comparator and is excluded from the implementation sorry count. The public
    random weight wrappers return a topology only bound for every positive
    realization and retain the exact Hoeffding exponent without a mean ratio
    assumption. Proposition 3 uses balanced targets in the zero sum
    subspace, whose dimension is proved to be n - 1.
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
